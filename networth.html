<script>
    // Get all input fields
    const inputs = document.querySelectorAll('input[type="number"]');
    
    // Asset fields
    const cashInput = document.getElementById('cash');
    const investmentsInput = document.getElementById('investments');
    const propertyInput = document.getElementById('property');
    const vehiclesInput = document.getElementById('vehicles');
    const otherAssetsInput = document.getElementById('other-assets');
    
    // Liability fields
    const mortgageInput = document.getElementById('mortgage');
    const loansInput = document.getElementById('loans');
    const creditCardsInput = document.getElementById('credit-cards');
    const otherLiabilitiesInput = document.getElementById('other-liabilities');
    
    // Display elements
    const netWorthDisplay = document.getElementById('netWorthDisplay');
    const totalAssetsDisplay = document.getElementById('totalAssets');
    const totalLiabilitiesDisplay = document.getElementById('totalLiabilities');

    function formatCurrency(value) {
        return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }).format(value);
    }

    function calculateNetWorth() {
        // Calculate total assets
        const totalAssets = 
            (parseFloat(cashInput.value) || 0) +
            (parseFloat(investmentsInput.value) || 0) +
            (parseFloat(propertyInput.value) || 0) +
            (parseFloat(vehiclesInput.value) || 0) +
            (parseFloat(otherAssetsInput.value) || 0);
        
        // Calculate total liabilities
        const totalLiabilities = 
            (parseFloat(mortgageInput.value) || 0) +
            (parseFloat(loansInput.value) || 0) +
            (parseFloat(creditCardsInput.value) || 0) +
            (parseFloat(otherLiabilitiesInput.value) || 0);
        
        // Calculate net worth
        const netWorth = totalAssets - totalLiabilities;
        
        // Update displays
        totalAssetsDisplay.textContent = formatCurrency(totalAssets);
        totalLiabilitiesDisplay.textContent = formatCurrency(totalLiabilities);
        netWorthDisplay.textContent = formatCurrency(netWorth);
        
        // Change color based on positive/negative
        if (netWorth >= 0) {
            netWorthDisplay.style.color = 'white';
        } else {
            netWorthDisplay.style.color = '#fca5a5';
        }
    }

    // Add event listeners to all inputs
    inputs.forEach(input => {
        input.addEventListener('input', calculateNetWorth);
    });

    // Initial calculation
    calculateNetWorth();
</script>
