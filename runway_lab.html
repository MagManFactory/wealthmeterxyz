            --blue-600: #2563eb;

            --amber-500: #f59e0b;

            color: var(--slate-900);
            margin: 0;
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
        
        .simulator-grid {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 40px;
            background: white;
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
            border: 1px solid var(--gray-200);
        }

        .input-pane { display: flex; flex-direction: column; gap: 24px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        
        label { 
            font-size: 0.75rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.12em; 
            color: var(--slate-900);
        }

        .input-help { font-size: 0.65rem; color: #64748b; margin-top: -4px; }

        input, select {
            padding: 14px;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            background: white;
        }

        .results-pane {
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            border: 1px solid var(--gray-200);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .runway-label { 
            font-size: 0.85rem; 
            font-weight: 800;
            color: var(--blue-600);
            text-transform: uppercase; 
            letter-spacing: 0.15em; 
        }

        .runway-value { 
            font-size: 5.5rem; 
            font-weight: 900; 
            margin: 10px 0; 
            color: var(--slate-900);
            letter-spacing: -0.04em;
        }

        .assessment-box {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.95rem;
            border-left: 4px solid var(--blue-600);
        }

        .geo-arbitrage-box {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--gray-200);
            text-align: left;
        }

        .geo-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #94a3b8; margin-bottom: 15px; }
        .geo-comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .geo-card { padding: 20px; border-radius: 12px; background: white; border: 1px solid var(--gray-200); }
        .geo-city-label { font-weight: 800; font-size: 0.8rem; color: var(--slate-900); margin-bottom: 5px; }
        .geo-years { font-family: 'JetBrains Mono', monospace; color: var(--cyan-500); font-size: 1.3rem; font-weight: 700; }

        .btn-calculate {
            background: var(--slate-900);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-calculate:hover { background: var(--blue-600); transform: translateY(-2px); }

        @media (max-width: 900px) { .simulator-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<script src="components.js?v=2026-03-30.2"></script>
<script>
    function calculateRunway() {
        const baseNW = parseFloat(document.getElementById('networth').value);
        const baseBurn = parseFloat(document.getElementById('burn').value);
        const yRate = parseFloat(document.getElementById('yield').value) / 100;
        const currentModifier = parseFloat(document.getElementById('currentLoc').value);
        
        // Dynamic Extraction of Select Data
        const t1Mod = parseFloat(document.getElementById('target1').value);
        const t1Name = document.getElementById('target1').options[document.getElementById('target1').selectedIndex].text;
        const t2Mod = parseFloat(document.getElementById('target2').value);
        const t2Name = document.getElementById('target2').options[document.getElementById('target2').selectedIndex].text;

        // Core Calculation: Normalized Burn Rate
        // Logic: (Baseline Burn / Baseline Modifier) * Target Modifier [cite: 2025-11-11]
        const baselineYears = runSim(baseNW, baseBurn, yRate);
        const t1Years = runSim(baseNW, (baseBurn / currentModifier) * t1Mod, yRate);
        const t2Years = runSim(baseNW, (baseBurn / currentModifier) * t2Mod, yRate);

        updateDisplay('runwayDisplay', baselineYears);
        updateDisplay('valT1', t1Years);
        updateDisplay('valT2', t2Years);
        
        document.getElementById('labelT1').textContent = t1Name;
        document.getElementById('labelT2').textContent = t2Name;

        const assessment = document.getElementById('assessmentText');
        if (baselineYears === Infinity) {
            assessment.innerText = "ASSESSMENT: Perpetual Solvency. Your yield covers your global baseline burn.";
        } else if (baselineYears > 30) {
            assessment.innerText = "ASSESSMENT: High Sustainability. Runway exceeds standard generational cycles.";
        } else {
            assessment.innerText = "ASSESSMENT: Critical Burn. Strategic relocation or yield enhancement recommended.";
        }
    }

    function runSim(nw, burn, yield) {
        if (nw * yield >= burn) return Infinity;
        let years = 0;
        let tempNW = nw;
        while (tempNW > 0 && years < 100) {
            tempNW = (tempNW * (1 + yield)) - burn;
            if (tempNW > 0) years++;
        }
        return years;
    }

    function updateDisplay(id, val) {
        const el = document.getElementById(id);
        if (val === Infinity) el.textContent = "INFINITE";
        else el.textContent = (val >= 100 ? "100+" : val) + " Years";
    }

    window.onload = calculateRunway;
</script>
