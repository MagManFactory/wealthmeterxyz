<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Data Atlas | WealthMeter Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0056b3; --accent: #00bcd4; --dark: #020617; --slate: #475569; 
            --border: #e2e8f0; --bg-app: #f1f5f9; --font-ui: 'Inter', sans-serif; 
            --font-data: 'JetBrains Mono', monospace; --brand-red: #FF4B4B;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { margin: 0; font-family: var(--font-ui); background: var(--bg-app); color: var(--dark); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Segmented Navigation (Dieter Rams Style) */
        .navigation-hub { background: white; border-bottom: 1px solid var(--border); padding: 20px; display: flex; justify-content: center; gap: 8px; z-index: 1000; flex-wrap: wrap; }
        .reg-btn { padding: 8px 16px; border: 1px solid var(--border); background: white; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; color: var(--slate); transition: 0.2s; }
        .reg-btn.active { border-color: var(--primary); color: var(--primary); background: #eff6ff; box-shadow: 0 4px 12px rgba(0, 86, 179, 0.08); }

        /* The Universal Reel */
        .stage { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
        
        .reel-window { 
            width: 440px; height: 380px; background: white; border-radius: 30px; 
            border: 3px solid var(--border); overflow: hidden; position: relative; 
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.05), 0 40px 80px rgba(0,0,0,0.03);
            cursor: ns-resize;
        }
        .reel-strip { position: absolute; top: 0; width: 100%; transition: transform 0.1s ease-out; }
        .reel-item { 
            height: 380px; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; border-bottom: 1px solid #f1f5f9; transition: 0.3s;
        }
        .reel-item:hover { background: #fafafa; }
        .r-flag { font-size: 6.5rem; line-height: 1; margin-bottom: 25px; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.08)); }
        .r-name { font-weight: 900; font-size: 2rem; text-align: center; color: var(--dark); letter-spacing: -0.04em; }

        /* Shuffle Controls */
        .controls { display: flex; gap: 20px; margin-top: 40px; align-items: center; }
        .spin-btn { 
            background: var(--brand-red); color: white; border: none; padding: 20px 45px; 
            border-radius: 12px; font-weight: 900; text-transform: uppercase; 
            letter-spacing: 0.15em; cursor: pointer; box-shadow: 0 12px 25px rgba(255, 75, 75, 0.25);
            transition: 0.3s;
        }
        .spin-btn:hover { transform: translateY(-3px); background: var(--dark); }
        .manual-hint { font-size: 0.65rem; font-weight: 800; color: var(--slate); text-transform: uppercase; letter-spacing: 0.1em; }

        /* Actuarial Results Card */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(2, 6, 23, 0.98); backdrop-filter: blur(25px); 
            display: none; align-items: center; justify-content: center; z-index: 5000;
        }
        .data-card { 
            background: white; width: 100%; max-width: 550px; padding: 60px; 
            border-radius: 40px; position: relative; text-align: center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
        }
        .close-btn { position: absolute; top: 30px; right: 35px; font-size: 2.5rem; cursor: pointer; color: var(--slate); line-height: 1; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
        .stat-node { background: #f8fafc; padding: 20px; border-radius: 15px; border: 1px solid var(--border); text-align: left; }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; font-weight: 800; color: var(--slate); margin-bottom: 8px; letter-spacing: 0.05em; }
        .stat-val { font-family: var(--font-data); font-weight: 800; font-size: 1.25rem; color: var(--dark); }
        .lev-highlight { grid-column: span 2; background: #eff6ff; border-color: var(--primary); }
    </style>
</head>
<body onload="setRegion('Americas', document.querySelector('.reg-btn'))">

<div id="header-placeholder"></div>

<div class="navigation-hub">
    <button class="reg-btn active" onclick="setRegion('Americas', this)">Americas</button>
    <button class="reg-btn" onclick="setRegion('Europe', this)">Europe</button>
    <button class="reg-btn" onclick="setRegion('Asia-Pacific', this)">Asia-Pacific</button>
    <button class="reg-btn" onclick="setRegion('Oceania', this)">Oceania</button>
    <button class="reg-btn" onclick="setRegion('Middle East', this)">Middle East</button>
    <button class="reg-btn" onclick="setRegion('Africa', this)">Africa</button>
</div>

<main class="stage">
    <div class="reel-window" id="reelWindow" onwheel="handleScroll(event)">
        <div class="reel-strip" id="reelStrip"></div>
    </div>
    
    <div class="controls">
        <span class="manual-hint">Scroll to Browse</span>
        <button class="spin-btn" id="spinTrigger" onclick="spinRegistry()">Randomize choice</button>
        <span class="manual-hint">Click Card to Select</span>
    </div>
</main>

<div class="overlay" id="overlay">
    <div class="data-card">
        <span class="close-btn" onclick="closeOverlay()">×</span>
        <div id="resFlag" style="font-size: 7rem; margin-bottom: 25px; line-height: 1;"></div>
        <h1 id="resName" style="font-size: 3rem; font-weight: 900; margin: 0; letter-spacing: -0.05em; line-height: 1;"></h1>
        <p id="resCap" style="text-transform: uppercase; font-weight: 800; color: var(--slate); font-size: 0.85rem; letter-spacing: 0.15em; margin-top: 10px;"></p>
        
        <div class="stat-grid">
            <div class="stat-node"><div class="stat-label">Population</div><div class="stat-val" id="resPop"></div></div>
            <div class="stat-node"><div class="stat-label">GDP / Cap</div><div class="stat-val" id="resGdp"></div></div>
            <div class="stat-node"><div class="stat-label">Independence Horizon</div><div class="stat-val" id="resLife"></div></div>
            <div class="stat-node lev-highlight"><div class="stat-label">Projected LEV Extension</div><div class="stat-val" id="resLev" style="color:var(--primary); font-size: 1.8rem;"></div></div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

    ];

    let currentRegion = 'Americas';
    let scrollPos = 0;
    const ITEM_HEIGHT = 380;
    let isSpinning = false;

    function setRegion(reg, btn) {
        if (isSpinning) return;
        document.querySelectorAll('.reg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRegion = reg;
        scrollPos = 0;
        initializeReel();
    }

    function initializeReel() {
        const strip = document.getElementById('reelStrip');
        const list = db.filter(c => c.region === currentRegion);
        const content = [...list, ...list, ...list].map(c => `
            <div class="reel-item" onclick="launchCard('${c.name}')">
                <div class="r-flag">${c.flag}</div>
                <div class="r-name">${c.name}</div>
            </div>
        `).join('');
        strip.innerHTML = content;
        strip.style.transition = "none";
        strip.style.transform = `translateY(0px)`;
    }

    function handleScroll(e) {
        if (isSpinning) return;
        e.preventDefault();
        const strip = document.getElementById('reelStrip');
        const itemCount = strip.children.length;
        const maxScroll = (itemCount - 1) * ITEM_HEIGHT;
        
        scrollPos = Math.max(0, Math.min(maxScroll, scrollPos + (e.deltaY > 0 ? ITEM_HEIGHT : -ITEM_HEIGHT)));
        strip.style.transition = "transform 0.4s cubic-bezier(0.23, 1, 0.32, 1)";
        strip.style.transform = `translateY(-${scrollPos}px)`;
    }

    function spinRegistry() {
        if (isSpinning) return;
        isSpinning = true;
        const strip = document.getElementById('reelStrip');
        const itemCount = strip.children.length;
        const randomTarget = Math.floor(Math.random() * (itemCount / 3)) + (itemCount / 3);
        const finalPos = randomTarget * ITEM_HEIGHT;
        
        strip.style.transition = "transform 3s cubic-bezier(0.15, 0, 0.15, 1)";
        strip.style.transform = `translateY(-${finalPos}px)`;
        scrollPos = finalPos;

        setTimeout(() => {
            isSpinning = false;
            const selectedName = strip.children[randomTarget].querySelector('.r-name').innerText;
            launchCard(selectedName);
        }, 3200);
    }

    function launchCard(name) {
        const data = db.find(c => c.name === name);
        if (!data) return;
        document.getElementById('resFlag').innerText = data.flag;
        document.getElementById('resName').innerText = data.name;
        document.getElementById('resCap').innerText = data.capital;
        document.getElementById('resPop').innerText = data.pop;
        document.getElementById('resGdp').innerText = data.gdp;
        document.getElementById('resLife').innerText = data.life;
        document.getElementById('resLev').innerText = data.lev;
        document.getElementById('overlay').style.display = 'flex';
    }

    function closeOverlay() { 
        document.getElementById('overlay').style.display = 'none';
        isSpinning = false; 
    }
</script>
