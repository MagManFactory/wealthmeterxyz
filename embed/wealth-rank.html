<body>
  <main class="meter-widget" data-widget="wealth-rank">
    <div class="widget-brand"><strong>WEALTH<span style="color:#2563eb">METER</span><span style="color:#0891b2">.XYZ</span></strong><span class="widget-badge">2026 data</span></div>
    <p class="widget-kicker">Global Wealth Rank</p>
    <h1>Where does your net worth place you?</h1>
    <p class="widget-copy">Estimate your position across the 3.846 billion adults represented in the global model.</p>
    <form id="wealth-widget-form" class="widget-grid">
      <label class="widget-field"><span>Net worth</span><input id="wealth-widget-value" type="number" min="0" step="1000" inputmode="decimal" placeholder="250,000" required></label>
      <label class="widget-field"><span>Currency</span><select id="wealth-widget-currency"><option>USD</option><option>EUR</option><option>GBP</option><option>CAD</option><option>JPY</option><option>INR</option><option>AUD</option><option>CNY</option><option>CHF</option></select></label>
      <button class="widget-button" type="submit">Discover my global wealth rank</button>
    </form>
    <section id="wealth-widget-result" class="widget-result" aria-live="polite">
      <div class="widget-result-label">Estimated global wealth position</div>
      <div id="wealth-widget-rank" class="widget-result-value">#—</div>
      <p id="wealth-widget-summary"></p>
    </section>
    <p id="wealth-widget-status" class="widget-status" role="status"></p>
    <footer class="widget-footer"><span>Planning estimate · inputs stay in this frame</span><a class="widget-link" href="https://wealthmeter.xyz/" target="_blank" rel="noopener canonical">Open the full calculator →</a></footer>
  </main>
