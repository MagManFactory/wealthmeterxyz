name: Content Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  content-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check banned internal prompt text
        run: bash scripts/check_content_policy.sh
      - name: Validate governed commercial placements
        run: python3 scripts/validate_monetization.py

  live-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [content-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Allow GitHub Pages to publish
        run: sleep 60
      - name: Verify live content policy
        run: bash scripts/verify_live_content_policy.sh https://wealthmeter.xyz https://wealthmeter.xyz/longform.html
